<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byte Bay - Combo Cards Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; font-family: 'Inter', sans-serif; padding: 40px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .combo-card { background: linear-gradient(145deg, #1e2633 0%, #161d27 100%); border: 1px solid #2d3748; border-radius: 18px; overflow: hidden; width: 320px; transition: transform 0.35s cubic-bezier(0.25,0.8,0.25,1), box-shadow 0.35s ease, border-color 0.35s ease; position: relative; }
  .combo-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(217,244,91,0.15); border-color: #3b4a5f; }
  .combo-media { position: relative; aspect-ratio: 1/1; background: radial-gradient(ellipse at center, #2a3647 0%, #161d27 70%); border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .combo-media img { max-width: 85%; max-height: 85%; object-fit: contain; transition: transform 0.4s cubic-bezier(0.25,0.8,0.25,1); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); }
  .combo-card:hover .combo-media img { transform: scale(1.08); }
  .combo-badge { position: absolute; top: 12px; left: 12px; background: rgba(16,185,129,0.18); border: 1px solid rgba(16,185,129,0.5); color: #34d399; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; padding: 5px 12px; border-radius: 999px; text-transform: uppercase; backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .combo-discount { position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 10px; box-shadow: 0 4px 12px rgba(225,29,72,0.4); }
  .combo-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, #1e2633 0%, #1a222e 100%); }
  .combo-title { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #f1f5f9; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; min-height: 40px; }
  .combo-prices { display: flex; align-items: baseline; gap: 10px; }
  .combo-old-price { font-size: 13px; color: #64748b; text-decoration: line-through; font-weight: 500; }
  .combo-price { font-size: 24px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
  .combo-save-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #2d3748; border-bottom: 1px solid #2d3748; }
  .combo-save { font-size: 12px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .combo-save::before { content: "Ahorro"; font-size: 10px; text-transform: uppercase; }
  .combo-stock { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
  .combo-stock::before { content: "●"; color: #22c55e; font-size: 8px; }
  .combo-cta { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; border: none; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 16px rgba(16,185,129,0.3); margin-top: 4px; }
  .combo-cta:hover { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 6px 20px rgba(16,185,129,0.45); transform: translateY(-2px); }
  .combo-cta svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <article class="combo-card">
    <div class="combo-media">
      <span class="combo-badge">PACK AHORRO</span>
      <span class="combo-discount">-10%</span>
      <img src="img/productos/pack-13.webp" alt="Pack Calzado + Sandalias">
    </div>
    <div class="combo-body">
      <h3 class="combo-title">Pack Calzado + Sandalias</h3>
      <div class="combo-prices">
        <span class="combo-old-price">S/ 328.00</span>
        <strong class="combo-price">S/ 295.20</strong>
      </div>
      <div class="combo-save-row">
        <span class="combo-save">Ahorras S/ 32.80</span>
        <span class="combo-stock">30 disp.</span>
      </div>
      <button class="combo-cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> Agregar al carrito</button>
    </div>
  </article>
  <article class="combo-card">
    <div class="combo-media">
      <span class="combo-badge">PACK AHORRO</span>
      <span class="combo-discount">-10%</span>
      <img src="img/productos/pack-14.webp" alt="Pack Cocina Completa">
    </div>
    <div class="combo-body">
      <h3 class="combo-title">Pack Cocina Completa</h3>
      <div class="combo-prices">
        <span class="combo-old-price">S/ 598.00</span>
        <strong class="combo-price">S/ 538.20</strong>
      </div>
      <div class="combo-save-row">
        <span class="combo-save">Ahorras S/ 59.80</span>
        <span class="combo-stock">30 disp.</span>
      </div>
      <button class="combo-cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> Agregar al carrito</button>
    </div>
  </article>
</body>
</html>
