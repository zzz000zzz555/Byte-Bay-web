name: CI - Byte Bay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis JavaScript del núcleo
        run: |
          status=0
          for file in *.js; do
            node --check "$file" || status=1
          done
          exit $status

      - name: Sin secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$'; then
            echo "ERROR: hay un .env real versionado"
            exit 1
          fi
          if grep -rEn --include='*.js' --include='*.ts' --include='*.html' --include='*.css' --include='*.env' \
            'sk_test_[A-Za-z0-9]{10,}|sk_live_[A-Za-z0-9]{10,}|sb_secret_[A-Za-z0-9]{10,}|AIza[A-Za-z0-9_-]{20,}|APP_USR-[A-Za-z0-9_-]{10,}|TEST-[A-Za-z0-9_-]{10,}|whsec_[A-Za-z0-9]{10,}|xoxb-[A-Za-z0-9-]{10,}|AKIA[A-Z0-9]{12,}|SG\.[A-Za-z0-9_-]{10,}\.|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' \
            --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "ERROR: posible secreto real versionado"; exit 1
          fi

      - name: Referencias locales existentes
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          fallo = False
          for html in ('index.html', 'admin.html'):
            texto = pathlib.Path(html).read_text(encoding='utf-8', errors='replace')
            for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', texto):
              if ref.startswith(('http', 'data:', '#', 'mailto:', 'tel:', '{{')):
                continue
              archivo = ref.split('?', 1)[0].split('#', 1)[0]
              if not pathlib.Path(archivo).exists():
                print(f'REFERENCIA ROTA {html}: {ref}')
                fallo = True
          sys.exit(1 if fallo else 0)
          PY

      - name: Sin archivos internos en el árbol servido
        run: |
          patron='^(supabase/|generador_afiches/|vercel\.json$|_headers$|QR YAPE BERU \.jpeg$|[^/]*\.(sql|ps1|md)$)'
          if git ls-files | grep -Eq "$patron"; then
            echo "ERROR: hay archivos internos versionados en main; GitHub Pages los serviría"
            git ls-files | grep -E "$patron"
            exit 1
          fi

      - name: Diff limpio
        run: git diff --check
